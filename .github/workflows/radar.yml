# 뉴스 레이더 — 강회장 PC 가 꺼져 있어도 깃허브가 대신 돌린다.
#
# ── 왜 클라우드인가 ────────────────────────────────────────────────
# 로컬 예약작업(install_task.ps1)은 노트북을 닫는 순간 멈춘다. 그리고
# **멈춘 걸 아무도 모른다.** 뉴스 알림은 "안 온 것"과 "일이 없는 것"이
# 구분이 안 되니까 더 위험하다. 그래서 감시는 깃허브에서 돌린다.
#
# ── 중복 방지 상태는 어디 있나 ──────────────────────────────────────
# data/radar.db(30일치 seen + 직전가)를 actions/cache 로 이어붙인다.
# 캐시가 날아가면 DB 가 새것이 되고, first_run_silent 가 켜져 있어서
# 그 한 사이클은 **조용히 학습만 하고 지나간다** — 과거 기사 폭탄이 아니라
# 알림 한 번 거르는 쪽으로 실패한다. 의도된 실패 방향이다.
name: 뉴스 레이더

on:
  # 깃허브 schedule 은 붐비면 건너뛴다(24h 96회 중 6회만 돎, 2026-09-13 실측).
  # 그래서 cron-job.org 가 15분마다(00·15·30·45분) workflow_dispatch API 를 호출해 깨운다.
  workflow_dispatch: # cron-job.org 트리거 + 손으로도 즉시 실행

concurrency:
  group: radar
  cancel-in-progress: false # 돌고 있으면 끼어들지 않는다(중복 알림 방지)

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 이전 사이클의 "이미 보낸 것" 기억을 이어받는다
      - name: 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: 상태 확인
        run: |
          if [ -f data/radar.db ]; then
            echo "캐시 적중 — 중복 방지 기억 이어받음 ($(du -h data/radar.db | cut -f1))"
          else
            echo "::warning::캐시 없음 — 이번 사이클은 조용히 학습만 하고 지나간다"
          fi

      # 슬랙·텔레그램 동시 발송 기간. 둘 중 하나만 있어도 돈다(없는 쪽은 조용히 건너뜀).
      - name: 수집 · 채점 · 슬랙/텔레그램 전송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_NEWS: ${{ secrets.TELEGRAM_BOT_TOKEN_NEWS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_NEWS: ${{ secrets.TELEGRAM_TOPIC_NEWS }}
          PYTHONUTF8: '1'
        run: |
          HAS_TG=""
          if { [ -n "$TELEGRAM_BOT_TOKEN_NEWS" ] || [ -n "$TELEGRAM_BOT_TOKEN" ]; } && [ -n "$TELEGRAM_CHAT_ID" ]; then
            HAS_TG=1
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ] && [ -z "$HAS_TG" ]; then
            echo "::error::알림 경로가 없다. Secrets 에 SLACK_WEBHOOK_URL 또는 TELEGRAM_BOT_TOKEN_NEWS(또는 TELEGRAM_BOT_TOKEN)+TELEGRAM_CHAT_ID 를 추가할 것"
            exit 1
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "::notice::SLACK_WEBHOOK_URL 없음 — 텔레그램으로만 보낸다"; fi
          if [ -z "$HAS_TG" ]; then echo "::notice::텔레그램 변수 없음 — 슬랙으로만 보낸다"; fi
          if [ -n "$HAS_TG" ] && [ -z "$TELEGRAM_TOPIC_NEWS" ]; then
            echo "::warning::TELEGRAM_TOPIC_NEWS 가 없어 슈퍼그룹 일반 대화방으로 간다"
          fi
          python run_once.py

      # 전송이 실패했어도 상태는 남겨야 한다(실패한 건은 seen 에 안 들어가서 다음 턴 재시도됨)
      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-state-${{ github.run_id }}
